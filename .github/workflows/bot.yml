name: 24/7 Telegram Bot Runner

on:
  schedule:
    # Trigger every 5 hours (GitHub Action runners kill jobs after 6h)
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 320 # ~5.3 hours before gracefully restarting next run
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telegram Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
          FORWARD_GROUP_ID: ${{ secrets.FORWARD_GROUP_ID }}
          CHECKER_API_KEY: ${{ secrets.CHECKER_API_KEY }}
          OTP_GROUP_URL: ${{ secrets.OTP_GROUP_URL }}
          BOT_URL: ${{ secrets.BOT_URL }}
          LAMIX_API_TOKEN: ${{ secrets.LAMIX_API_TOKEN }}
          LAMIX_BASE_URL: ${{ secrets.LAMIX_BASE_URL }}
          LAMIX_POLL_INTERVAL: ${{ secrets.LAMIX_POLL_INTERVAL }}
          SEVENONETEL_API_KEY: ${{ secrets.SEVENONETEL_API_KEY }}
          SEVENONETEL_BASE_URL: ${{ secrets.SEVENONETEL_BASE_URL }}
          SEVENONETEL_POLL_INTERVAL: ${{ secrets.SEVENONETEL_POLL_INTERVAL }}
          DB_PATH: seven.db
        run: |
          python bot.py
